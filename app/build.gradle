plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'hu.chrys78.midea'
    compileSdk 36

    defaultConfig {
        applicationId 'hu.chrys78.midea'
        minSdk 24
        targetSdk 30
        versionCode 1
        versionName '1.0.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.13"
        buildPython("python")

        pip {
            install "midea-beautiful-air==0.10.7"
        }
    }
}
